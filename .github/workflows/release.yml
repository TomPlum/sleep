name: Deploy Sleep App
run-name: deploy-sleep-app
on:
  push:
    branches:
      - release
permissions:
  contents: write
env:
  TZ: UTC
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Run Unit Tests
        run: npm run test:ci
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist